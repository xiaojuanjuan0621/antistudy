<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>有声故事馆 · 知识冒险岛</title>
<link rel="stylesheet" href="hall.css">
<style>
  .foot-txt{font-size:15px;font-weight:800;color:#2A5FD6}
</style>
</head>
<body>
<div class="view">
  <div class="stage" id="stage">
    <img class="bg" src="assets/home2-bg.png" alt="">
    <div class="mask"></div>

    <div class="title-bar"></div>
    <img class="home-btn" id="homeBtn" src="assets/bag2-ico-home.png" alt="">
    <div class="title">有声故事馆</div>

    <div class="stat" style="left:962px"><b id="cntAudio">0</b><span>个故事</span></div>
    <div class="stat" style="left:1156px"><b id="cntMins">0</b><span>分钟</span></div>

    <div class="content" style="height:590px">
      <div class="grid3" id="grid"></div>
    </div>

    <div class="player" id="player">
      <img class="pcov" id="pCover" src="" alt="">
      <div class="pinfo">
        <b id="pTitle">选一段故事开始收听</b>
        <span id="pSpeaker">—</span>
      </div>
      <div class="pbtn prev" id="pPrev"></div>
      <div class="pbtn main" id="pPlay"></div>
      <div class="pbtn next" id="pNext"></div>
      <div class="ptrack" id="pTrack"><div class="pfill" id="pFill"></div><div class="pdot" id="pDot"></div></div>
      <div class="ptime" id="pTime">00:00 / 00:00</div>
    </div>

    <div class="nav-bar"></div>
    <img class="nav-ico" data-go="home.html" src="assets/nav-home.png" style="left:114.6px" alt="">
    <div class="nav-label" data-go="home.html" style="left:88.04px">首页</div>
    <img class="nav-ico" data-go="task.html" src="assets/nav-task.png" style="left:384.1px" alt="">
    <div class="nav-label" data-go="task.html" style="left:357.51px">任务</div>
    <img class="nav-ico" data-go="battle.html" src="assets/nav-battle.png" style="left:653.9px" alt="">
    <div class="nav-label" data-go="battle.html" style="left:624.3px">战斗</div>
    <img class="nav-ico" data-go="bag.html" src="assets/nav-bag.png" style="left:923.0px" alt="">
    <div class="nav-label" data-go="bag.html" style="left:896.44px">储物袋</div>
    <img class="nav-ico" data-go="me.html" src="assets/nav-me.png" style="left:1189.8px" alt="">
    <div class="nav-label" data-go="me.html" style="left:1163.23px">我的</div>

    <div class="toast" id="toast"></div>
  </div>
</div>
<script src="store.js?v=3"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() {
    var s = Math.min(window.innerWidth / 1366, window.innerHeight / 1024);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
  fit();

  var grid = document.getElementById('grid');
  var AUDIOS = Store.AUDIOS || [];
  var cur = -1;
  var audio = new Audio();
  audio.preload = 'metadata';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function mmss(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function toneOf(cat) {
    if (/国学|古诗/.test(cat)) return 'orange';
    if (/宇宙|科学/.test(cat)) return 'purple';
    if (/名著|故事/.test(cat)) return 'green';
    return 'gray';
  }

  function render() {
    grid.innerHTML = '';
    document.getElementById('cntAudio').textContent = AUDIOS.length;
    var mins = 0;
    AUDIOS.forEach(function (a) { mins += Math.round((a.seconds || 0) / 60); });
    document.getElementById('cntMins').textContent = mins;

    if (!AUDIOS.length) {
      grid.style.display = 'block';
      grid.innerHTML = '<div class="empty">还没有音频 · 家长可以在家长中心「内容馆」上传</div>';
      return;
    }
    grid.style.display = 'grid';

    AUDIOS.forEach(function (a, i) {
      var playing = (i === cur && !audio.paused);
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="covwrap">' +
          '<img class="cov" src="' + a.cover + '" alt="">' +
          '<div class="badge">' + mmss(a.seconds) + '</div>' +
        '</div>' +
        '<div class="body">' +
          '<div class="ttl">' + esc(a.title) + '</div>' +
          '<div class="sub">' + esc(a.speaker) + ' · ' + (a.playCount || 0) + ' 次收听</div>' +
          '<div class="tags">' +
            '<span class="tag ' + toneOf(a.category) + '">' + esc(a.category) + '</span>' +
          '</div>' +
          '<div class="foot">' +
            '<div class="playbtn' + (playing ? ' playing' : '') + '"></div>' +
            '<span class="foot-txt">' + (playing ? '正在播放' : '播放') + '</span>' +
          '</div>' +
        '</div>';
      card.addEventListener('click', function () {
        if (i === cur) { toggle(); } else { play(i); }
      });
      grid.appendChild(card);
    });
  }

  /* 原始音频是外链，网络不通时自动退到本地示范音频，避免点了没声音 */
  var LOCAL_AUDIO = 'assets/hall/story.m4a';
  var useLocal = false;
  var loadTimer = null;

  function fallbackLocal() {
    if (useLocal) return;
    useLocal = true;
    clearTimeout(loadTimer);
    Store.toast('外链音频打不开，已切换本地示范音频');
    audio.src = LOCAL_AUDIO;
    var p = audio.play();
    if (p && p.catch) p.catch(function () {});
  }

  function play(i) {
    if (i < 0 || i >= AUDIOS.length) return;
    cur = i;
    var a = AUDIOS[i];
    audio.src = useLocal ? LOCAL_AUDIO : a.url;
    document.getElementById('pCover').src = a.cover;
    document.getElementById('pTitle').textContent = a.title;
    document.getElementById('pSpeaker').textContent = a.speaker + ' · ' + a.category;

    var p = audio.play();
    if (p && p.catch) {
      p.catch(function () {
        render();
        syncBtn();
      });
    }
    render();
    syncProgress();

    clearTimeout(loadTimer);
    if (!useLocal) {
      loadTimer = setTimeout(function () {
        if (!isFinite(audio.duration) || audio.duration === 0) fallbackLocal();
      }, 6000);
    }
  }

  audio.addEventListener('error', function () {
    if (cur >= 0 && !useLocal) fallbackLocal();
  });

  function toggle() {
    if (cur < 0) { if (AUDIOS.length) play(0); return; }
    if (audio.paused) {
      var p = audio.play();
      if (p && p.catch) p.catch(function () { Store.toast('播放失败'); });
    } else {
      audio.pause();
    }
  }

  function syncBtn() {
    var btn = document.getElementById('pPlay');
    if (audio.paused) btn.classList.remove('playing');
    else btn.classList.add('playing');
    render();
  }

  function syncProgress() {
    var d = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
    var ratio = d ? audio.currentTime / d : 0;
    document.getElementById('pFill').style.width = (ratio * 100) + '%';
    document.getElementById('pDot').style.left = 'calc(' + (ratio * 100) + '% - 9px)';
    document.getElementById('pTime').textContent =
      mmss(audio.currentTime) + ' / ' + mmss(d || (AUDIOS[cur] ? AUDIOS[cur].seconds : 0));
  }

  audio.addEventListener('timeupdate', syncProgress);
  audio.addEventListener('loadedmetadata', syncProgress);
  audio.addEventListener('play', syncBtn);
  audio.addEventListener('pause', syncBtn);
  audio.addEventListener('ended', function () {
    if (AUDIOS.length > 1) play((cur + 1) % AUDIOS.length);
    else syncBtn();
  });

  document.getElementById('pPlay').addEventListener('click', toggle);
  document.getElementById('pPrev').addEventListener('click', function () {
    if (!AUDIOS.length) return;
    play((cur - 1 + AUDIOS.length) % AUDIOS.length);
  });
  document.getElementById('pNext').addEventListener('click', function () {
    if (!AUDIOS.length) return;
    play((cur + 1) % AUDIOS.length);
  });

  document.getElementById('pTrack').addEventListener('click', function (e) {
    var d = audio.duration;
    if (!isFinite(d) || d <= 0) return;
    var r = this.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    audio.currentTime = ratio * d;
    syncProgress();
  });

  document.getElementById('homeBtn').addEventListener('click', function () {
    location.href = 'home.html';
  });
  document.querySelectorAll('[data-go]').forEach(function (el) {
    el.addEventListener('click', function () { location.href = el.dataset.go; });
  });

  render();
  syncProgress();
})();
</script>
</body>
</html>
