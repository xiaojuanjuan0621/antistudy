<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>有声故事馆 · 知识冒险岛</title>
<link rel="stylesheet" href="hall.css">
<style>
  .foot-txt{font-size:15px;font-weight:800;color:#2A5FD6}
</style>
</head>
<body>
<div class="view">
  <div class="stage" id="stage">
    <img class="bg" src="assets/home2-bg.png" alt="">
    <div class="mask"></div>

    <div class="title-bar"></div>
    <img class="home-btn" id="homeBtn" src="assets/bag2-ico-home.png" alt="">
    <div class="title">有声故事馆</div>

    <div class="stat" style="left:962px"><b id="cntAlbum">0</b><span>张专辑</span></div>
    <div class="stat" style="left:1156px"><b id="cntEps">0</b><span>个故事</span></div>

    <div class="content" style="height:590px" id="content"></div>

    <div class="player" id="player">
      <img class="pcov" id="pCover" src="assets/hall/audio_wukong.jpg" alt="">
      <div class="pinfo">
        <b id="pTitle">选一段故事开始收听</b>
        <span id="pSpeaker">—</span>
      </div>
      <div class="pbtn prev" id="pPrev"></div>
      <div class="pbtn main" id="pPlay"></div>
      <div class="pbtn next" id="pNext"></div>
      <div class="ptrack" id="pTrack"><div class="pfill" id="pFill"></div><div class="pdot" id="pDot"></div></div>
      <div class="ptime" id="pTime">00:00 / 00:00</div>
    </div>

    <div class="nav-bar"></div>
    <img class="nav-ico" data-go="home.html" src="assets/nav-home.png" style="left:114.6px" alt="">
    <div class="nav-label" data-go="home.html" style="left:88.04px">首页</div>
    <img class="nav-ico" data-go="task.html" src="assets/nav-task.png" style="left:384.1px" alt="">
    <div class="nav-label" data-go="task.html" style="left:357.51px">任务</div>
    <img class="nav-ico" data-go="battle.html" src="assets/nav-battle.png" style="left:653.9px" alt="">
    <div class="nav-label" data-go="battle.html" style="left:624.3px">战斗</div>
    <img class="nav-ico" data-go="bag.html" src="assets/nav-bag.png" style="left:923.0px" alt="">
    <div class="nav-label" data-go="bag.html" style="left:896.44px">储物袋</div>
    <img class="nav-ico" data-go="me.html" src="assets/nav-me.png" style="left:1189.8px" alt="">
    <div class="nav-label" data-go="me.html" style="left:1163.23px">我的</div>

    <div class="toast" id="toast"></div>
  </div>
</div>
<script src="store.js?v=4"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() {
    var s = Math.min(window.innerWidth / 1366, window.innerHeight / 1024);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
  fit();

  var content = document.getElementById('content');
  var ALBUMS = Store.AUDIOS || [];

  var view = 'albums';     // albums | eps
  var curAlbum = null;
  var queue = [];          // 当前播放队列（某张专辑的单集）
  var cur = -1;            // 队列里的下标

  var audio = new Audio();
  audio.preload = 'metadata';

  var LOCAL_AUDIO = '';
  var useLocal = false;
  var loadTimer = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function mmss(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function toneOf(cat) {
    if (/国学|古诗|名著/.test(cat)) return 'orange';
    if (/宇宙|科学/.test(cat)) return 'purple';
    if (/历史/.test(cat)) return 'green';
    return 'gray';
  }
  function totalEps() {
    var n = 0;
    ALBUMS.forEach(function (a) { n += (a.episodes || []).length; });
    return n;
  }

  /* ---------------- 专辑列表 ---------------- */
  function renderAlbums() {
    view = 'albums';
    curAlbum = null;
    content.innerHTML = '';
    document.getElementById('cntAlbum').textContent = ALBUMS.length;
    document.getElementById('cntEps').textContent = totalEps();

    if (!ALBUMS.length) {
      content.innerHTML = '<div class="empty">还没有音频 · 家长可以在家长中心「内容馆」上传</div>';
      return;
    }

    var grid = document.createElement('div');
    grid.className = 'alist';
    content.appendChild(grid);

    ALBUMS.forEach(function (a) {
      var n = (a.episodes || []).length;
      var card = document.createElement('div');
      card.className = 'alcard';
      card.innerHTML =
        '<img class="acov" src="' + a.cover + '" alt="">' +
        '<div class="abody">' +
          '<div class="aname">' + esc(a.name) + '</div>' +
          '<div class="asub">' + esc(a.speaker || '') +
            (a.speaker ? ' · ' : '') + n + ' 个故事</div>' +
          '<div class="tags"><span class="tag ' + toneOf(a.category) + '">' +
            esc(a.category || '故事') + '</span></div>' +
          '<div class="afoot">' +
            '<div class="playbtn"></div>' +
            '<span class="foot-txt">查看列表</span>' +
          '</div>' +
        '</div>';

      card.addEventListener('click', function () { renderEps(a); });
      card.querySelector('.playbtn').addEventListener('click', function (e) {
        e.stopPropagation();
        queue = a.episodes || [];
        curAlbum = a;
        if (queue.length) play(0);
      });

      grid.appendChild(card);
    });
  }

  /* ---------------- 单集列表 ---------------- */
  function renderEps(album) {
    view = 'eps';
    curAlbum = album;
    queue = album.episodes || [];
    content.innerHTML = '';

    var crumb = document.createElement('div');
    crumb.className = 'crumb';
    var back = document.createElement('div');
    back.className = 'back';
    back.textContent = '‹ 返回专辑';
    back.addEventListener('click', renderAlbums);
    crumb.appendChild(back);
    var ct = document.createElement('div');
    ct.className = 'ct';
    ct.textContent = album.name;
    crumb.appendChild(ct);
    var cc = document.createElement('div');
    cc.className = 'cc';
    cc.textContent = queue.length + ' 首';
    crumb.appendChild(cc);
    content.appendChild(crumb);

    if (!queue.length) {
      content.appendChild(elEmpty('这张专辑还没有音频'));
      return;
    }

    var list = document.createElement('div');
    list.className = 'tlist';

    queue.forEach(function (ep, i) {
      var row = document.createElement('div');
      row.className = 'trow' + (i === cur && !audio.paused ? ' playing' : '');
      row.innerHTML =
        '<div class="tn">' + (i + 1) + '</div>' +
        '<div class="tt2"><b>' + esc(ep.title) + '</b>' +
          '<span>' + esc(ep.speaker || album.speaker || album.name) + '</span></div>' +
        '<div class="td">' + mmss(ep.seconds) + '</div>' +
        '<div class="go"></div>';
      row.addEventListener('click', function () {
        if (i === cur) toggle();
        else play(i);
      });
      list.appendChild(row);
    });

    content.appendChild(list);
    updateRows();
  }

  function elEmpty(txt) {
    var d = document.createElement('div');
    d.className = 'empty';
    d.textContent = txt;
    return d;
  }

  function updateRows() {
    content.querySelectorAll('.trow').forEach(function (r, i) {
      if (i === cur && !audio.paused) r.classList.add('playing');
      else r.classList.remove('playing');
    });
  }

  /* ---------------- 播放 ---------------- */
  function fallbackLocal() {
    if (useLocal || !LOCAL_AUDIO) return;
    useLocal = true;
    clearTimeout(loadTimer);
    Store.toast('这段音频打不开，让家长检查一下文件');
    audio.src = LOCAL_AUDIO;
    var p = audio.play();
    if (p && p.catch) p.catch(function () {});
  }

  function play(i) {
    if (i < 0 || i >= queue.length) return;
    cur = i;
    var ep = queue[i];

    document.getElementById('pCover').src = (curAlbum && curAlbum.cover) || 'assets/hall/audio_wukong.jpg';
    document.getElementById('pTitle').textContent = ep.title;
    document.getElementById('pSpeaker').textContent =
      (ep.speaker || (curAlbum && curAlbum.speaker) || '') +
      (curAlbum ? ' · ' + curAlbum.name : '');

    if (!ep.url) {
      Store.toast('这一集还没有音频文件');
      return;
    }
    audio.src = ep.url;
    var p = audio.play();
    if (p && p.catch) p.catch(function () {});
    syncProgress();
    updateRows();

    clearTimeout(loadTimer);
    if (!useLocal) {
      loadTimer = setTimeout(function () {
        if (!isFinite(audio.duration) || audio.duration === 0) fallbackLocal();
      }, 8000);
    }
  }

  function toggle() {
    if (cur < 0) { if (queue.length) play(0); return; }
    if (audio.paused) {
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    } else {
      audio.pause();
    }
  }

  function syncBtn() {
    var btn = document.getElementById('pPlay');
    if (audio.paused) btn.classList.remove('playing');
    else btn.classList.add('playing');
    updateRows();
  }

  function syncProgress() {
    var d = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
    var fallback = queue[cur] ? queue[cur].seconds : 0;
    var ratio = d ? audio.currentTime / d : 0;
    document.getElementById('pFill').style.width = (ratio * 100) + '%';
    document.getElementById('pDot').style.left = 'calc(' + (ratio * 100) + '% - 9px)';
    document.getElementById('pTime').textContent =
      mmss(audio.currentTime) + ' / ' + mmss(d || fallback);
  }

  audio.addEventListener('timeupdate', syncProgress);
  audio.addEventListener('loadedmetadata', function () {
    clearTimeout(loadTimer);
    syncProgress();
  });
  audio.addEventListener('play', syncBtn);
  audio.addEventListener('pause', syncBtn);
  audio.addEventListener('ended', function () {
    if (queue.length > 1) play((cur + 1) % queue.length);
    else syncBtn();
  });
  audio.addEventListener('error', function () {
    if (cur >= 0 && !useLocal) fallbackLocal();
  });

  document.getElementById('pPlay').addEventListener('click', toggle);
  document.getElementById('pPrev').addEventListener('click', function () {
    if (!queue.length) return;
    play((cur - 1 + queue.length) % queue.length);
  });
  document.getElementById('pNext').addEventListener('click', function () {
    if (!queue.length) return;
    play((cur + 1) % queue.length);
  });

  document.getElementById('pTrack').addEventListener('click', function (e) {
    var d = audio.duration;
    if (!isFinite(d) || d <= 0) return;
    var r = this.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    audio.currentTime = ratio * d;
    syncProgress();
  });

  document.getElementById('homeBtn').addEventListener('click', function () {
    location.href = 'home.html';
  });
  document.querySelectorAll('[data-go]').forEach(function (el) {
    el.addEventListener('click', function () { location.href = el.dataset.go; });
  });

  renderAlbums();
})();
</script>
</body>
</html>
