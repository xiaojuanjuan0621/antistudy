<script src="store.js?v=2"></script>
<script>
  // 首次进入的选蛋引导由入口页用 home.html?first=1 触发；
  // 单页预览/直接打开首页时不再强制跳走，否则所有热区都点不到
  try {
    if (!Store.hasEgg() && /[?&]first=1/.test(location.search)) location.replace('egg-select.html');
  } catch (e) {}

  var stage = document.getElementById('stage');
  function fit() {
    var s = Math.min(window.innerWidth / 1366, window.innerHeight / 1024);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
  fit();

  var SUBJECT_COURSE = {
    '语文': 'series_chinese_xes',
    '数学': 'series_math_g4',
    '英语': 'series_english_tbd',
    '科普': 'series_bio_g4'
  };

  function clock() {
    var d = new Date();
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    document.querySelector('.clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    document.querySelector('.date').textContent = pad(d.getMonth() + 1) + '/' + pad(d.getDate());
    var W = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    document.querySelector('.week').textContent = W[d.getDay()];
  }
  clock();
  setInterval(clock, 30000);

  function render() {
    var s = Store.get();
    document.getElementById('stoneTop').textContent = Store.fmt(s.stone);
    document.querySelector('.user span:last-child').textContent = s.user.name;

    var ci = document.querySelector('.checkin span i');
    if (ci) ci.textContent = s.streak;

    var pct = s.pet.hatch;
    var fill = document.getElementById('hatchFill');
    var dot = document.querySelector('.hatch-track b');
    var w = 117.39 * pct / 100;
    fill.style.width = w + 'px';
    dot.style.left = Math.max(0, w - 9.34) + 'px';
    document.querySelector('.hatch-pct').textContent = pct + '%';
  }

  render();

  document.querySelectorAll('.card').forEach(function (c) {
    c.addEventListener('click', function () {
      var cid = SUBJECT_COURSE[c.dataset.card];
      if (!cid) { Store.toast('「' + c.dataset.card + '」体系还没录入'); return; }
      Store.toast('进入「' + c.dataset.card + '」课程');
      setTimeout(function () { location.href = 'course.html?course=' + cid; }, 380);
    });
  });

  /* 绘本馆 → 少年阅览室 / 音乐馆 → 有声故事馆 / 动画馆 → 知识冒险岛视频 */
  var TOOL_PAGE = {
    '绘本馆': 'library.html',
    '音乐馆': 'music.html',
    '动画馆': 'cartoon.html'
  };
  document.querySelectorAll('.t-ico,.t-label').forEach(function (el) {
    el.addEventListener('click', function () {
      var n = el.classList.contains('t-label') ? el.textContent : el.nextElementSibling.textContent;
      n = (n || '').trim();
      var page = TOOL_PAGE[n];
      if (!page) { Store.toast('「' + n + '」还没做'); return; }
      Store.toast('打开「' + n + '」');
      setTimeout(function () { location.href = page; }, 320);
    });
  });

  document.querySelectorAll('.entry').forEach(function (e) {
    e.addEventListener('click', function () {
      var n = e.dataset.entry;
      var map = { '灵石商城': 'mall.html', '储物袋': 'bag.html', '灵宠': 'pet.html' };
      if (map[n]) { Store.toast('打开「' + n + '」'); setTimeout(function () { location.href = map[n]; }, 320); }
      else { Store.toast('「' + n + '」还没做'); }
    });
  });

  document.querySelectorAll('.nav-ico,.nav-label').forEach(function (el) {
    el.addEventListener('click', function () {
      var n = el.dataset.nav;
      document.querySelectorAll('.nav-label').forEach(function (t) { t.style.color = '#2442A3'; });
      document.querySelectorAll('.nav-label[data-nav="' + n + '"]').forEach(function (t) { t.style.color = '#0F8CEB'; });
      Store.go(n);
    });
  });

  document.querySelector('.checkin').addEventListener('click', function () {
    var r = Store.checkin();
    render();
    Store.toast(r.ok ? '打卡成功 · 连续 ' + r.streak + ' 天 · 灵石 +10' : '今天已经打过卡啦 · 连续 ' + r.streak + ' 天');
  });

  document.getElementById('parentEntry').addEventListener('click', function () {
    location.href = 'parent.html';
  });

  document.querySelector('.user').addEventListener('click', function () {
    location.href = 'me.html';
  });

  document.getElementById('wchip').addEventListener('click', function () {
    location.href = 'mall.html';
  });

  document.querySelector('.hatch').addEventListener('click', function () {
    location.href = 'pet.html';
  });
</script>

</html>
