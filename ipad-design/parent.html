<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家长中心 · 知识冒险岛</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#081A3A;
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent}
  .view{position:relative;width:100%;height:100%;overflow:hidden}
  .stage{position:absolute;left:50%;top:50%;width:1366px;height:1024px;transform-origin:center center}

  .bg{position:absolute;left:0;top:0;width:1366px;height:1024px;
    background:radial-gradient(900px 600px at 12% 8%,#1B4C8F 0%,rgba(27,76,143,0) 62%),
               radial-gradient(700px 500px at 92% 92%,#173F7C 0%,rgba(23,63,124,0) 60%),
               linear-gradient(155deg,#0A1F45 0%,#123566 52%,#0C2549 100%)}

  /* ---------- 顶栏 ---------- */
  .topbar{position:absolute;left:0;top:0;width:1366px;height:104px;
    display:flex;align-items:center;padding:0 40px;gap:14px}
  .brand{flex:1;min-width:0}
  .bt{font-size:36px;font-weight:900;color:#fff;letter-spacing:1px;line-height:1.15}
  .bs{font-size:16px;font-weight:600;color:#9FC3F0;margin-top:4px}
  .conn{display:flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:24px;
    font-size:16px;font-weight:700;background:rgba(255,255,255,.1);color:#CFE3FF;max-width:430px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conn::before{content:"";width:10px;height:10px;border-radius:50%;background:#8AA6CC;flex:0 0 auto}
  .conn.ok{background:rgba(47,197,110,.16);color:#9BF3C1}
  .conn.ok::before{background:#2FC56E;box-shadow:0 0 10px #2FC56E}
  .conn.bad{background:rgba(255,90,95,.16);color:#FFB9BB}
  .conn.bad::before{background:#FF5A5F}

  .btn{height:48px;padding:0 26px;border-radius:24px;display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;cursor:pointer;user-select:none;transition:transform .12s,opacity .15s}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:linear-gradient(180deg,#5AA8FF,#2F7EF0);color:#fff;
    box-shadow:0 6px 16px rgba(47,126,240,.45)}
  .btn.primary[disabled]{opacity:.55}
  .btn.ghost{background:rgba(255,255,255,.12);color:#D6E7FF}
  .btn.wide{width:100%;height:56px;border-radius:28px;font-size:20px}

  /* ---------- 左侧导航 ---------- */
  .side{position:absolute;left:40px;top:128px;width:212px}
  .nav{padding:18px 20px;border-radius:20px;cursor:pointer;margin-bottom:12px;
    background:rgba(255,255,255,.07);border:1.5px solid transparent;transition:background .15s,border-color .15s}
  .nav b{display:block;font-size:20px;font-weight:800;color:#DCEAFF}
  .nav i{display:block;font-style:normal;font-size:13px;font-weight:600;color:#7FA5D2;margin-top:5px}
  .nav.on{background:rgba(90,168,255,.18);border-color:rgba(90,168,255,.55)}
  .nav.on b{color:#fff}
  .nav.on i{color:#A9CDFF}
  .tip{margin-top:18px;font-size:13px;line-height:1.7;color:#7EA3CE;padding:0 4px}

  /* ---------- 内容面板 ---------- */
  .panel{position:absolute;left:280px;top:128px;width:1046px;height:856px;background:#fff;
    border-radius:30px;box-shadow:0 20px 60px rgba(3,14,36,.45);overflow:hidden}
  .pane{position:absolute;left:0;top:0;width:100%;height:100%;overflow-y:auto;
    padding:26px 30px 40px;-webkit-overflow-scrolling:touch}
  .pane::-webkit-scrollbar{width:8px}
  .pane::-webkit-scrollbar-thumb{background:#D6E2F2;border-radius:4px}

  .ph{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .ph h2{font-size:24px;font-weight:900;color:#11284F}
  .ph .sub{font-size:14px;font-weight:600;color:#7C93B0;flex:1}
  .mini{height:40px;padding:0 18px;border-radius:20px;background:#EAF3FF;color:#2F7EF0;
    font-size:15px;font-weight:800;display:flex;align-items:center;cursor:pointer;white-space:nowrap;
    transition:background .15s}
  .mini:active{background:#D6E8FF}
  .mini.solid{background:linear-gradient(180deg,#5AA8FF,#2F7EF0);color:#fff}
  .mini.danger{background:#FFEDEE;color:#E03B40}

  .hint{font-size:13.5px;line-height:1.75;color:#7C93B0;background:#F5F9FF;border-radius:14px;
    padding:12px 16px;margin:12px 0 18px}

  /* 表格式行 */
  .thead,.row{display:grid;align-items:center;gap:12px}
  .thead{font-size:13px;font-weight:800;color:#8AA0BC;padding:0 4px 10px;letter-spacing:.5px}
  .row{background:#F8FBFF;border:1.5px solid #E8F0FA;border-radius:16px;padding:12px 14px;margin-bottom:10px}
  .row:hover{border-color:#CFE1F7;background:#F5FAFF}
  .row .idx{font-size:13px;font-weight:800;color:#9DB2CC}

  .g-series{grid-template-columns:1fr 1.15fr 108px 116px 62px 44px}
  .g-lessons{grid-template-columns:54px 1fr 1fr 78px 196px 44px}
  .g-items{grid-template-columns:96px 1fr;gap:16px;align-items:start}

  .inp,.sel{width:100%;font-family:inherit;font-size:16px;font-weight:600;color:#11284F;
    background:#fff;border:1.5px solid #DCE7F5;border-radius:11px;padding:9px 11px;outline:none;
    transition:border-color .15s,box-shadow .15s}
  .inp:focus,.sel:focus{border-color:#4A93FE;box-shadow:0 0 0 3px rgba(74,147,254,.14)}
  .inp::placeholder{color:#A9BCD4;font-weight:500}
  .sel{cursor:pointer;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,#8AA0BC 50%),linear-gradient(135deg,#8AA0BC 50%,transparent 50%);
    background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
  .inp.num{text-align:center;font-family:Inter,sans-serif;font-weight:800}

  .ro{font-size:15px;font-weight:700;color:#5C7396;padding:9px 4px;text-align:center}
  .del{width:38px;height:38px;border-radius:12px;background:#FFEDEE;color:#E03B40;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;cursor:pointer;
    transition:background .15s}
  .del:active{background:#FFDBDD}

  /* 视频单元格 */
  .vcell{min-width:0}
  .vfile{font-size:12.5px;font-weight:700;color:#2F7EF0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-bottom:7px;cursor:pointer}
  .vfile.empty{color:#C0393E}
  .vacts{display:flex;gap:7px}
  .vbtn{flex:1;height:32px;border-radius:10px;background:#EAF3FF;color:#2F7EF0;font-size:12.5px;
    font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap}
  .vbtn:active{background:#D6E8FF}
  .vbtn.dark{background:#EEF2F8;color:#5C7396}

  .prog{height:6px;border-radius:3px;background:#E3EDF9;margin-top:8px;overflow:hidden;display:none}
  .prog.on{display:block}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5AA8FF,#2FC56E);
    border-radius:3px;transition:width .18s}

  /* 商城卡片 */
  .icard{background:#F8FBFF;border:1.5px solid #E8F0FA;border-radius:20px;padding:16px;
    display:grid;grid-template-columns:104px 1fr;gap:16px;margin-bottom:12px}
  .icard:hover{border-color:#CFE1F7}
  .ishot{width:104px;height:104px;border-radius:16px;background:#fff;border:1.5px dashed #CFE1F7;
    display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative}
  .ishot img{width:100%;height:100%;object-fit:contain}
  .ishot .ph2{font-size:12px;font-weight:800;color:#9DB2CC;text-align:center;line-height:1.5;padding:0 6px}
  .ishot .up{position:absolute;left:0;bottom:0;width:100%;height:24px;background:rgba(17,40,79,.62);
    color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .ifields{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
  .ifields .full{grid-column:1/-1}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0}
  .field label{font-size:11.5px;font-weight:800;color:#8AA0BC;letter-spacing:.4px;padding-left:2px}

  /* 内容馆子标签 */
  .subtabs{display:flex;gap:10px;margin:14px 0 18px}
  .subtab{height:46px;padding:0 22px;border-radius:23px;background:#F1F6FD;color:#5C7396;
    font-size:16px;font-weight:800;display:flex;align-items:center;cursor:pointer;
    border:1.5px solid transparent;transition:background .15s}
  .subtab.on{background:linear-gradient(180deg,#5AA8FF,#2F7EF0);color:#fff;
    box-shadow:0 5px 14px rgba(47,126,240,.35)}
  .ta{width:100%;font-family:inherit;font-size:15px;font-weight:600;color:#11284F;
    background:#fff;border:1.5px solid #DCE7F5;border-radius:11px;padding:10px 12px;
    outline:none;resize:vertical;line-height:1.7;min-height:96px}
  .ta:focus{border-color:#4A93FE;box-shadow:0 0 0 3px rgba(74,147,254,.14)}
  .eprow{display:grid;grid-template-columns:44px 1fr 76px 200px 40px;gap:10px;align-items:center;
    background:#fff;border:1.5px solid #E8F0FA;border-radius:13px;padding:9px 11px;margin-bottom:8px}
  .eprow .idx{font-size:13px;font-weight:800;color:#9DB2CC;text-align:center}

  /* 系统页 */
  .sect{background:#F8FBFF;border:1.5px solid #E8F0FA;border-radius:20px;padding:20px 22px;margin-bottom:14px}
  .sect h3{font-size:17px;font-weight:900;color:#11284F;margin-bottom:4px}
  .sect p{font-size:13.5px;line-height:1.75;color:#7C93B0;margin-bottom:14px}
  .sect .line{display:flex;gap:12px;align-items:center}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kv div{background:#fff;border-radius:14px;padding:14px 10px;text-align:center;border:1.5px solid #E8F0FA}
  .kv b{display:block;font-family:Inter,sans-serif;font-size:26px;font-weight:900;color:#2F7EF0}
  .kv span{font-size:12.5px;font-weight:700;color:#8AA0BC}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#11284F;color:#B8D6FF;
    border-radius:12px;padding:12px 16px;margin-top:12px;-webkit-user-select:text;user-select:text;
    word-break:break-all;line-height:1.7}

  /* 密码门 */
  .gate{position:absolute;left:0;top:0;width:1366px;height:1024px;background:rgba(6,17,38,.93);
    display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(6px)}
  .gate.hide{display:none}
  .gate-box{width:460px;background:#fff;border-radius:28px;padding:40px 38px 34px;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .gate-t{font-size:28px;font-weight:900;color:#11284F}
  .gate-s{font-size:14.5px;font-weight:600;color:#8AA0BC;margin:10px 0 26px;line-height:1.6}
  .gate-in{width:100%;height:76px;border-radius:20px;border:2px solid #DCE7F5;background:#F8FBFF;
    text-align:center;font-size:38px;font-weight:900;letter-spacing:14px;color:#11284F;outline:none;
    font-family:Inter,sans-serif;padding-left:14px}
  .gate-in:focus{border-color:#4A93FE;background:#fff}
  .gate-e{height:24px;font-size:13.5px;font-weight:800;color:#E03B40;margin:8px 0 6px}
  .shake{animation:sh .3s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

  .toast{position:absolute;left:50%;top:880px;transform:translateX(-50%);padding:15px 32px;border-radius:20px;
    background:rgba(9,25,60,.92);color:#fff;font-size:19px;font-weight:800;opacity:0;
    pointer-events:none;transition:opacity .2s;white-space:nowrap;z-index:60}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="view">
  <div class="stage" id="stage">
    <div class="bg"></div>

    <div class="topbar">
      <div class="brand">
        <div class="bt">家长中心</div>
        <div class="bs">课程分类 · 内容馆 · 灵石商城</div>
      </div>
      <div class="conn" id="conn">正在连接家长服务…</div>
      <div class="btn ghost" id="homeBtn">返回首页</div>
      <div class="btn primary" id="saveBtn">保存修改</div>
    </div>

    <div class="side" id="side">
      <div class="nav on" data-tab="series"><b>课程分类</b><i>学科 · 体系 · 年级</i></div>
      <div class="nav" data-tab="lessons"><b>讲次与视频</b><i>上传视频 · 时长</i></div>
      <div class="nav" data-tab="items"><b>灵石商城</b><i>图片 · 价格 · 分类</i></div>
      <div class="nav" data-tab="hall"><b>内容馆</b><i>有声 · 阅览 · 动画</i></div>
      <div class="nav" data-tab="sys"><b>系统设置</b><i>密码 · 数据 · 导出</i></div>
      <div class="tip">改完点右上角「保存修改」，孩子端刷新页面后生效。</div>
    </div>

    <div class="panel"><div class="pane" id="pane"></div></div>

    <div class="gate" id="gate">
      <div class="gate-box" id="gateBox">
        <div class="gate-t">家长验证</div>
        <div class="gate-s">请输入 4 位家长密码<br>首次使用默认 <b>1234</b></div>
        <input class="gate-in" id="gateIn" type="password" inputmode="numeric" maxlength="4"
               placeholder="••••" autocomplete="off">
        <div class="gate-e" id="gateErr"></div>
        <div class="btn primary wide" id="gateOk">进入家长中心</div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script src="store.js?v=3"></script>
<script>
(function () {
  'use strict';

  /* ============ 环境 ============ */
  var PORT = location.port || (location.protocol === 'file:' ? '' : '80');
  var API = PORT === '8780' ? ''
    : (location.protocol === 'file:' ? 'http://127.0.0.1:8780'
      : location.protocol + '//' + (location.hostname || '127.0.0.1') + ':8780');

  var PIN_KEY = 'antistudy.parent.pin';
  var AUTH_KEY = 'antistudy.parent.auth';
  var SUBJECTS = ['语文', '数学', '英语', '探索'];
  var GRADES = ['四年级', '五年级', '六年级'];
  var ICATS = ['道具', '装备', '服装', '宠物'];
  var ATTR = { '语文': '文心', '数学': '算力', '英语': '共鸣', '探索': '灵感' };

  var CATALOG = { v: 1, series: [], items: [] };
  var tab = 'series';
  var curCourse = '';
  var dirty = false;
  var connected = false;

  var pane = document.getElementById('pane');
  var connEl = document.getElementById('conn');
  var saveBtn = document.getElementById('saveBtn');
  var toastEl = document.getElementById('toast');

  /* ============ 小工具 ============ */
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
  function markDirty() {
    dirty = true;
    saveBtn.textContent = '保存修改 •';
    saveBtn.style.background = 'linear-gradient(180deg,#FFB055,#F08214)';
  }
  function clearDirty() {
    dirty = false;
    saveBtn.textContent = '保存修改';
    saveBtn.style.background = '';
  }
  function num(v, def) { var n = parseInt(v, 10); return isNaN(n) ? def : n; }
  function uid(prefix) {
    var n = 1;
    while (true) {
      var id = prefix + '_' + n;
      if (!CATALOG.series.some(function (s) { return s.id === id; })) return id;
      n++;
    }
  }

  function inp(val, ph, onchange, cls) {
    var i = el('input', 'inp' + (cls ? ' ' + cls : ''));
    i.value = val == null ? '' : String(val);
    if (ph) i.placeholder = ph;
    i.addEventListener('input', function () { onchange(i.value); markDirty(); });
    return i;
  }
  function numInp(val, onchange) {
    var i = inp(val, '', onchange, 'num');
    i.type = 'number';
    i.min = '0';
    return i;
  }
  function sel(opts, val, onchange) {
    var s = el('select', 'sel');
    opts.forEach(function (o) {
      var op = el('option', null, o);
      op.value = o;
      if (o === val) op.selected = true;
      s.appendChild(op);
    });
    s.addEventListener('change', function () { onchange(s.value); markDirty(); });
    return s;
  }
  function delBtn(onclick) {
    var d = el('div', 'del', '×');
    d.title = '删除';
    d.addEventListener('click', onclick);
    return d;
  }
  function ta(val, ph, onchange, rows) {
    var t = el('textarea', 'ta');
    t.value = val == null ? '' : String(val);
    t.rows = rows || 4;
    if (ph) t.placeholder = ph;
    t.addEventListener('input', function () { onchange(t.value); markDirty(); });
    return t;
  }

  /* 选文件 → 上传 → 回填。btnEl 用来显示上传中状态 */
  function pickUpload(kind, accept, btnEl, onDone) {
    pickFile(accept).then(function (file) {
      if (!file) return;
      var old = btnEl ? btnEl.textContent : '';
      if (btnEl) btnEl.textContent = '上传中…';
      uploadFile(file, kind)
        .then(function (j) {
          onDone(j.url, j);
          toast('已上传：' + j.name + '（' + (j.size / 1024 / 1024).toFixed(1) + 'MB）');
        })
        .catch(function (e) { toast('上传失败：' + e.message); })
        .then(function () { if (btnEl) btnEl.textContent = old; });
    });
  }

  /* ============ 网络 ============ */
  function checkConn() {
    return fetch(API + '/api/health', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error('bad');
        connected = true;
        connEl.className = 'conn ok';
        connEl.textContent = '已连接家长服务 · 端口 ' + j.port;
        return true;
      })
      .catch(function () {
        connected = false;
        connEl.className = 'conn bad';
        connEl.textContent = '未连接家长服务 · 先运行 node parent-server.js';
        return false;
      });
  }

  function uploadFile(file, kind, onProgress) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', API + '/api/upload?kind=' + encodeURIComponent(kind) +
        '&name=' + encodeURIComponent(file.name));
      xhr.setRequestHeader('X-Parent-Pin', getPin());
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
      };
      xhr.onload = function () {
        var j;
        try { j = JSON.parse(xhr.responseText); } catch (e) { return reject(new Error('服务返回异常')); }
        if (!j.ok) return reject(new Error(j.error || '上传失败'));
        resolve(j);
      };
      xhr.onerror = function () { reject(new Error('上传中断，家长服务没启动？')); };
      xhr.send(file);
    });
  }

  function pickFile(accept) {
    return new Promise(function (resolve) {
      var f = el('input');
      f.type = 'file';
      f.accept = accept;
      f.style.display = 'none';
      document.body.appendChild(f);
      f.addEventListener('change', function () {
        var file = f.files && f.files[0];
        document.body.removeChild(f);
        resolve(file || null);
      });
      f.click();
    });
  }

  /* ============ 载入 / 保存 ============ */
  function importFromStore() {
    var all = (Store && Store.allSeries) ? Store.allSeries() : {};
    var list = [];
    Object.keys(all).forEach(function (subject) {
      (all[subject] || []).forEach(function (s) {
        var c = Store.getCourse(s.id);
        if (!c) return;
        list.push({
          id: c.id,
          subject: c.subject || subject,
          name: c.name || s.tab || c.id,
          tab: s.tab || c.name || c.id,
          grade: s.grade || '四年级',
          attr: c.attr || ATTR[c.subject || subject] || '算力',
          lessons: (c.lessons || []).map(function (l) {
            return {
              n: l.n, title: l.title, sub: l.sub, min: l.min,
              video: l.video || '', quiz: l.quiz ? JSON.parse(JSON.stringify(l.quiz)) : []
            };
          })
        });
      });
    });
    return list;
  }

  function importItemsFromStore() {
    if (!Store || !Store.ITEMS) return [];
    return Store.ITEMS.map(function (i) {
      return {
        id: i.id, name: i.name, cat: i.cat, price: i.price, kind: i.kind,
        desc: i.desc || '', icon: i.icon || '', bagIcon: i.bagIcon || i.icon || ''
      };
    });
  }

  /* 内容馆：有声故事 / 少年阅览室 / 动画馆，首次进入时从客户端内置数据带过来 */
  function importBooks() {
    return JSON.parse(JSON.stringify((Store && Store.BOOKS) || []));
  }
  function importAudios() {
    return JSON.parse(JSON.stringify((Store && Store.AUDIOS) || []));
  }
  function importVideos() {
    return JSON.parse(JSON.stringify((Store && Store.VIDEOS) || []));

  function loadCatalog() {
    return fetch(API + '/api/catalog', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .catch(function () { return { v: 1, series: [], items: [] }; })
      .then(function (j) {
        CATALOG = j && typeof j === 'object' ? j : { v: 1, series: [], items: [] };
        if (!Array.isArray(CATALOG.series)) CATALOG.series = [];
        if (!Array.isArray(CATALOG.items)) CATALOG.items = [];

        /* 第一次用：把客户端内置数据带出来，家长不用从零填 */
        if (!CATALOG.series.length) { CATALOG.series = importFromStore(); markDirty(); }
        if (!CATALOG.items.length) { CATALOG.items = importItemsFromStore(); markDirty(); }

        /* 内容馆：字段不存在 = 还没配置过（带入内置）；空数组 = 家长主动删空了（尊重） */
        if (!Array.isArray(CATALOG.books)) { CATALOG.books = importBooks(); markDirty(); }
        if (!Array.isArray(CATALOG.audios)) { CATALOG.audios = importAudios(); markDirty(); }
        if (!Array.isArray(CATALOG.videos)) { CATALOG.videos = importVideos(); markDirty(); }

        if (!curCourse && CATALOG.series.length) curCourse = CATALOG.series[0].id;
      });
  }

  function save() {
    if (dirty === false) { toast('没有需要保存的修改'); return; }
    saveBtn.disabled = true;
    saveBtn.textContent = '保存中…';
    fetch(API + '/api/catalog', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Parent-Pin': getPin() },
      body: JSON.stringify(CATALOG)
    }).then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || '保存失败');
        clearDirty();
        toast('已保存 · 孩子端刷新页面即可看到');

      })
      .catch(function (e) { toast('保存失败：' + e.message); })
      .then(function () {
        saveBtn.disabled = false;
        if (dirty) markDirty();
      });
  }

  function currentTargets() {

      });
    }
    return [];
  }

  function pickFileMulti(accept, folder) {
    return new Promise(function (resolve) {
      var f = el('input');
      f.type = 'file';
      f.accept = accept;
      f.multiple = true;
      if (folder) { f.webkitdirectory = true; f.directory = true; }
      f.style.display = 'none';
      document.body.appendChild(f);
      f.addEventListener('change', function () {
        var list = [].slice.call(f.files || []);
        document.body.removeChild(f);
        resolve(list);
      });
      f.click();
    });
  }

  function naturalSort(files) {
    return files.slice().sort(function (a, b) {
      return a.name.localeCompare(b.name, 'zh-CN', { numeric: true });
    });
  }

  async function doBulkUpload(onProgress) {
    var files = naturalSort(bulkFiles);
    var total = files.length;
    var done = 0;
    var name = bulkName || (bulkType === 'audios' ? '我的专辑' : bulkType === 'books' ? '我的书系' : '我的系列');

    /* 目标容器 */
    var album = null, series = null;
    if (bulkType === 'audios') {
      if (bulkTarget) {
        album = (CATALOG.audios || []).filter(function (a) { return a.id === bulkTarget; })[0];
      }
      if (!album) {
        album = { id: 'album_' + Date.now(), name: name, subject: '语文', category: '国学经典',
          cover: '', speaker: '', episodes: [] };
        CATALOG.audios.push(album);
      }
    } else if (bulkType === 'videos') {
      if (bulkTarget) {
        series = (CATALOG.videos || []).filter(function (v) { return v.id === bulkTarget; })[0];
      }
      if (!series) {
        series = { id: 'series_' + Date.now(), name: name, subject: '探索', cover: '', desc: '', episodes: [] };
        CATALOG.videos.push(series);
      }
    }

    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      var j = await uploadFile(file, bulkType === 'audios' ? 'audio' : bulkType === 'videos' ? 'video' : 'book',
        function (p) { onProgress((done + p) / total); });
      done++;

      if (bulkType === 'audios') {
        album.episodes.push({
          id: 'ep_' + Date.now() + '_' + i,
          title: stripExt(file.name),
          speaker: '',
          seconds: 180,
          url: j.url
        });
        if (!album.cover && i === 0) album.cover = 'assets/hall/audio_wukong.jpg';
      } else if (bulkType === 'books') {
        CATALOG.books.push({
          id: 'book_' + Date.now() + '_' + i,
          title: stripExt(file.name),
          author: '', category: '课外阅读',
          cover: 'assets/hall/book_insects.jpg',
          minutes: 8, readCount: 0, done: false,
          summary: '', content: '',
          pdf: /\.(pdf|epub)$/i.test(file.name) ? j.url : ''
        });
      } else {
        series.episodes.push({
          n: series.episodes.length + 1,
          title: stripExt(file.name),
          sub: '', seconds: 300,
          video: j.url
        });
        if (!series.cover && i === 0) series.cover = 'assets/hall/series_math.jpg';
      }
      onProgress(done / total);
    }
  }

    return String(n || '').replace(/\.[^.]+$/, '');

      '课程体系：' + CATALOG.series.length + ' 个\n' +
      '商城商品：' + CATALOG.items.length + ' 个\n' +
      '上次保存：' + (CATALOG.updated ? new Date(CATALOG.updated).toLocaleString() : '还没有保存过')));
    pane.appendChild(s3);
  }

  /* ============ 路由 ============ */
  function courseById(id) {
    for (var i = 0; i < CATALOG.series.length; i++) if (CATALOG.series[i].id === id) return CATALOG.series[i];
    return null;
  }

  function render() {
    if (tab === 'series') renderSeries();
    else if (tab === 'lessons') renderLessons();
    else if (tab === 'items') renderItems();
    else if (tab === 'hall') renderHall();
    else renderSys();
  }

  document.querySelectorAll('.nav').forEach(function (n) {
    n.addEventListener('click', function () {
      document.querySelectorAll('.nav').forEach(function (x) { x.classList.remove('on'); });
      n.classList.add('on');
      tab = n.dataset.tab;
      render();
    });
  });

  /* ============ 密码门 ============ */
  var SESSION_PIN = 'antistudy.parent.pin.session';

  /* 本次登录用的密码会记在 sessionStorage，保存/上传时作为令牌发给服务端 */
  function getPin() {
    try {
      var s = sessionStorage.getItem(SESSION_PIN);
      if (s) return s;
    } catch (e) {}
    try { return localStorage.getItem(PIN_KEY) || '1234'; } catch (e) { return '1234'; }
  }
  function isAuthed() {
    try { return sessionStorage.getItem(AUTH_KEY) === '1'; } catch (e) { return false; }
  }

  var gate = document.getElementById('gate');
  var gateIn = document.getElementById('gateIn');
  var gateErr = document.getElementById('gateErr');
  var gateBox = document.getElementById('gateBox');
  var authing = false;

  function wrongPin(msg) {
    gateErr.textContent = msg || '密码不对，再试一次';
    gateIn.value = '';
    gateBox.classList.add('shake');
    setTimeout(function () { gateBox.classList.remove('shake'); }, 320);
  }
  function passGate(v) {
    try {
      sessionStorage.setItem(AUTH_KEY, '1');
      sessionStorage.setItem(SESSION_PIN, v);
    } catch (e) {}
    gateErr.textContent = '';
    gate.classList.add('hide');
  }

  function tryAuth() {
    var v = (gateIn.value || '').trim();
    if (!v) return;
    if (authing) return;
    authing = true;

    /* 有家长服务时由服务端校验（服务器上可用 PARENT_PIN 环境变量改密码）；
     * 本地没起服务时退回本机校验，纯静态预览也能进 */
    fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: v })
    }).then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) passGate(v);
        else wrongPin('密码不对，再试一次');
      })
      .catch(function () {
        if (v === getPin()) passGate(v);
        else wrongPin('密码不对，再试一次');
      })
      .then(function () { authing = false; });
  }

  document.getElementById('gateOk').addEventListener('click', tryAuth);
  gateIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryAuth(); });
  gateIn.addEventListener('input', function () {
    if (gateIn.value.length >= 4) tryAuth();
  });

  /* ============ 顶栏 ============ */
  saveBtn.addEventListener('click', save);
  document.getElementById('homeBtn').addEventListener('click', function () {
    if (dirty && !confirm('还有修改没保存，确定离开？')) return;
    location.href = 'home.html';
  });
  window.addEventListener('beforeunload', function (e) {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = '';
  });

  /* ============ 适配 + 启动 ============ */
  var stage = document.getElementById('stage');
  function fit() {
    var s = Math.min(window.innerWidth / 1366, window.innerHeight / 1024);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
  fit();

  if (isAuthed()) gate.classList.add('hide');
  else setTimeout(function () { gateIn.focus(); }, 300);

  checkConn()
    .then(loadCatalog)
    .then(function () { render(); })
    .catch(function (e) {
      render();
      toast('初始化失败：' + (e && e.message ? e.message : e));
    });
})();
</script>
</body>
</html>
