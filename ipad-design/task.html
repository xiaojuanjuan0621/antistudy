<script src="store.js?v=2"></script>
<script>
  var stage = document.getElementById('stage');
  function fit() {
    var s = Math.min(window.innerWidth / 1366, window.innerHeight / 1024);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  addEventListener('resize', fit); addEventListener('orientationchange', fit); fit();

  var TASKS = [
    { key: 'chinese', name: '语文修行', go: 'course.html?course=series_chinese_xes',
      check: function () { return Store.doneCount('series_chinese_xes') > 0; } },
    { key: 'math', name: '数学修行', go: 'course.html?course=series_math_g4',
      check: function () { return Store.doneCount('series_math_g4') > 0; } },
    { key: 'english', name: '英语修行', go: 'course.html?course=series_english_tbd',
      check: function () { return Store.doneCount('series_english_tbd') > 0; } },
    { key: 'science', name: '科普探索', go: 'course.html?course=series_bio_g4',
      check: function () { return Store.doneCount('series_bio_g4') > 0; } },
    { key: 'battle', name: '灵宠挑战', go: 'battle.html',
      check: function () { return !!Store.getTasks().battle; } }
  ];

  document.getElementById('numStone').textContent = Store.fmt(Store.get().stone);
  document.getElementById('numExp').textContent = Store.get().exp;

  var nodes = document.querySelectorAll('.task');
  var claim = document.getElementById('claim');

  function render() {
    var doneN = 0;
    nodes.forEach(function (t, i) {
      var def = TASKS[i];
      var ok = def.check();
      if (ok) doneN++;
      var btn = t.querySelector('.t-btn');
      if (ok) {
        t.classList.add('done');
        btn.className = 't-btn done';
        btn.innerHTML = '<i class="tick">✓</i><span>已完成</span>';
      } else {
        t.classList.remove('done');
        btn.className = 't-btn go';
        btn.innerHTML = '<span>去完成</span>';
      }
    });
    document.getElementById('count').textContent = doneN + ' / 5';
    claim.classList.toggle('on', doneN === 5);
    return doneN;
  }

  nodes.forEach(function (t, i) {
    t.querySelector('.t-btn').addEventListener('click', function (ev) {
      ev.stopPropagation();
      var ok = TASKS[i].check();
      if (ok) { Store.toast('这个任务今天已经完成啦'); return; }
      location.href = TASKS[i].go;
    });
  });

  claim.addEventListener('click', function () {
    var doneN = render();
    if (doneN < 5) { Store.toast('还有 ' + (5 - doneN) + ' 个任务没完成'); return; }
    var r = Store.claimTasks();
    Store.toast(r.ok ? '奖励已领取 · 灵石 +50 经验 +100' : r.msg);
  });

  document.getElementById('back').addEventListener('click', function () { location.href = 'home.html'; });
  document.querySelectorAll('.plus').forEach(function (p) {
    p.addEventListener('click', function () { location.href = 'mall.html'; });
  });
  document.querySelectorAll('.nav-ico,.nav-label').forEach(function (el) {
    el.addEventListener('click', function () {
      var go = el.dataset.go;
      if (go) location.href = go;
      else Store.toast('「' + el.dataset.name + '」还没做');
    });
  });

  render();
</script>
